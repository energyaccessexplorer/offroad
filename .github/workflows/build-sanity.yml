# Runs the Makefile targets departer's offline builds use, so a broken
# Makefile or offroad.diff fails here rather than on a production request.
# Skips `fetch`, which downloads real datasets.
name: BUILD SANITY

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-sanity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: sudo apt-get install -y bmake curl jq zip patch

      - name: gobuild
        run: bmake gobuild

      - name: website build target
        run: bmake website

      - name: tool build target
        run: bmake tool
